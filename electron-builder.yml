appId: "com.pawos.pet"
productName: "PawOS"

asar: true

files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - src/pets/**/*
  # webpack.main.config.js deliberately leaves sharp/docx/xlsx unbundled
  # (native binary + real Node-behavior-detection quirks — see its own
  # comments), so they must actually be resolvable from node_modules at
  # runtime. electron-builder's own default dependency-tree walk (not a
  # blanket exclusion) is what correctly includes exactly those packages
  # and their own transitive deps.

directories:
  buildResources: build

protocols:
  name: "PawOS Protocol"
  schemes:
    - pawos

win:
  target:
    - nsis
  artifactName: "PawOS-Setup-${version}.${ext}"
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

electronVersion: "35.0.0"

extraResources:
  - from: src/assets
    to: assets
    filter:
      - "**/*"
  - from: assets
    to: assets
    filter:
      - "**/*"
